apiVersion : apps/v1
kind : Deployment
metadata :
  name : springboot-deployment
  labels:
    app: springboot-app
spec:
    replicas: 2
    selector:
      matchLabels:
        app: springboot-app
    template:
      metadata:
        labels:
          app: springboot-app
      spec:
        containers:
          - name: springboot-container
            image: savio9481/ci-cd-pipeline:latest
            imagePullPolicy: Always
            ports:
              - containerPort: 8080

