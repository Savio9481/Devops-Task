<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${title}"></title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:500px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        h1{
            color:#0d6efd;
        }

        p{
            font-size:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 th:text="${title}"></h1>

    <p th:text="${message}"></p>

</div>

</body>
</html>
